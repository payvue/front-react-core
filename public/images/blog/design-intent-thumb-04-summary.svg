<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="230" y1="70" x2="1380" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F5FF"/>
      <stop offset="0.55" stop-color="#F2EDFF"/>
      <stop offset="1" stop-color="#ECE7FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="340" y1="200" x2="1220" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1320" cy="130" rx="220" ry="90" fill="#DDD6FE" fill-opacity="0.8"/>
  <ellipse cx="260" cy="780" rx="280" ry="110" fill="#E9D5FF" fill-opacity="0.5"/>

  <rect x="190" y="120" width="1220" height="660" rx="34" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2" filter="url(#shadow)"/>

  <text x="250" y="206" fill="#6D28D9" font-size="26" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">설계 핵심 요약</text>
  <text x="250" y="244" fill="#6B7280" font-size="16" font-family="IBM Plex Sans KR, sans-serif">코드로 설계 의도를 전달하기 위한 네 가지 기준</text>

  <rect x="250" y="300" width="520" height="172" rx="22" fill="#FBFAFF" stroke="url(#accent)" stroke-width="2"/>
  <text x="286" y="348" fill="#5B21B6" font-size="20" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">책임 중심 설계</text>
  <text x="286" y="384" fill="#6B7280" font-size="15" font-family="IBM Plex Sans KR, sans-serif">데이터보다 메시지와 협력을 먼저 정의</text>
  <text x="286" y="414" fill="#7C3AED" font-size="14" font-family="IBM Plex Sans KR, sans-serif">클라이언트 의도에 맞는 인터페이스 설계</text>

  <rect x="830" y="300" width="520" height="172" rx="22" fill="#FBFAFF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="866" y="348" fill="#5B21B6" font-size="20" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">캡슐화와 경계</text>
  <text x="866" y="384" fill="#6B7280" font-size="15" font-family="IBM Plex Sans KR, sans-serif">애그리게이트 루트와 모듈 경계로 일관성 유지</text>
  <text x="866" y="414" fill="#7C3AED" font-size="14" font-family="IBM Plex Sans KR, sans-serif">외부에는 최소 정보만 공개</text>

  <rect x="250" y="500" width="520" height="172" rx="22" fill="#FBFAFF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="286" y="548" fill="#5B21B6" font-size="20" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">확장 가능한 의존성</text>
  <text x="286" y="584" fill="#6B7280" font-size="15" font-family="IBM Plex Sans KR, sans-serif">ISP / DIP로 변경 비용을 낮추는 구조</text>
  <text x="286" y="614" fill="#7C3AED" font-size="14" font-family="IBM Plex Sans KR, sans-serif">정책과 구현의 분리 유지</text>

  <rect x="830" y="500" width="520" height="172" rx="22" fill="#FBFAFF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="866" y="548" fill="#5B21B6" font-size="20" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">컨텍스트 간 번역</text>
  <text x="866" y="584" fill="#6B7280" font-size="15" font-family="IBM Plex Sans KR, sans-serif">Context Map과 ACL로 모델 오염 방지</text>
  <text x="866" y="614" fill="#7C3AED" font-size="14" font-family="IBM Plex Sans KR, sans-serif">독립성 유지 + 협업 접점 명확화</text>

  <line x1="770" y1="386" x2="830" y2="386" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="770" y1="586" x2="830" y2="586" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="2"/>

  <circle cx="770" cy="386" r="8" fill="#8B5CF6"/>
  <circle cx="770" cy="586" r="8" fill="#8B5CF6"/>
  <circle cx="830" cy="386" r="8" fill="#C4B5FD"/>
  <circle cx="830" cy="586" r="8" fill="#C4B5FD"/>
</svg>
